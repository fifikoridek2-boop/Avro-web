<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Avro Documentation</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 768 768'%3E%3Cg transform='translate(-34 -17)'%3E%3Cpath d='M201.8 589.6L402.6 202.1L634.5 600.6' fill='none' stroke='%23000' stroke-width='144.01' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/g%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Arabic:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css" id="hljs-theme" />
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/highlight.min.js"></script>
    <style>
      :root {
        --ink: #0d0d0d;
        --surface: #ffffff;
        --surface-sub: #f6f6f6;
        --border: #e2e2e2;
        --muted: #666666;
        --accent: #000000;
        --accent-light: #f0f0f0;
        --sidebar-w: 280px;
        --header-h: 70px;
        --radius: 12px;
        --font-main: "Outfit", system-ui, sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }

      [data-theme="dark"] {
        --ink: #ededed;
        --surface: #0a0a0a;
        --surface-sub: #141414;
        --border: #262626;
        --muted: #999999;
        --accent: #ffffff;
        --accent-light: #1f1f1f;
      }

      html[dir="rtl"] {
        --font-main: "Noto Sans Arabic", "Outfit", system-ui, sans-serif;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: var(--font-main);
        background: var(--surface);
        color: var(--ink);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }

      /* Header */
      header {
        position: sticky;
        top: 0;
        z-index: 100;
        height: var(--header-h);
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        backdrop-filter: blur(12px);
      }
      .brand-box {
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
        color: var(--ink);
        font-weight: 600;
        font-size: 19px;
      }
      .brand-logo {
        height: 26px;
        width: auto;
        fill: currentColor;
      }
      .header-actions {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .lang-select, .theme-btn, .nav-link-btn {
        background: var(--surface-sub);
        border: 1px solid var(--border);
        color: var(--ink);
        padding: 7px 14px;
        border-radius: 999px;
        font-family: inherit;
        font-size: 14px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        text-decoration: none;
        transition: all 0.2s;
      }
      .lang-select:hover, .theme-btn:hover, .nav-link-btn:hover {
        background: var(--accent-light);
        border-color: var(--ink);
      }

      /* Layout */
      .layout-container {
        display: flex;
        min-height: calc(100vh - var(--header-h));
      }

      /* Sidebar */
      aside {
        width: var(--sidebar-w);
        border-right: 1px solid var(--border);
        background: var(--surface);
        overflow-y: auto;
        position: sticky;
        top: var(--header-h);
        height: calc(100vh - var(--header-h));
        padding: 20px 14px;
        flex-shrink: 0;
      }
      html[dir="rtl"] aside {
        border-right: none;
        border-left: 1px solid var(--border);
      }

      .search-box {
        margin-bottom: 20px;
      }
      .search-input {
        width: 100%;
        background: var(--surface-sub);
        border: 1px solid var(--border);
        padding: 8px 12px;
        border-radius: 8px;
        color: var(--ink);
        font-family: inherit;
        font-size: 13.5px;
        outline: none;
      }
      .search-input:focus {
        border-color: var(--ink);
      }

      .nav-group-title {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        font-weight: 700;
        margin: 18px 8px 8px;
      }
      .nav-item {
        display: block;
        padding: 7px 12px;
        border-radius: 8px;
        text-decoration: none;
        color: var(--muted);
        font-size: 14px;
        transition: all 0.15s ease;
        margin-bottom: 2px;
      }
      .nav-item:hover {
        color: var(--ink);
        background: var(--surface-sub);
      }
      .nav-item.active {
        color: var(--surface);
        background: var(--ink);
        font-weight: 500;
      }

      /* Content Area */
      main {
        flex: 1;
        max-width: 900px;
        margin: 0 auto;
        padding: 40px 32px 80px;
      }
      .doc-content h1 {
        font-size: 34px;
        letter-spacing: -0.03em;
        margin-bottom: 18px;
        line-height: 1.2;
      }
      .doc-content h2 {
        font-size: 24px;
        letter-spacing: -0.02em;
        margin: 36px 0 14px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--border);
      }
      .doc-content h3 {
        font-size: 19px;
        margin: 26px 0 10px;
      }
      .doc-content p {
        margin-bottom: 16px;
        font-size: 16px;
        color: var(--ink);
      }
      .doc-content ul, .doc-content ol {
        margin: 0 0 18px 24px;
      }
      html[dir="rtl"] .doc-content ul, html[dir="rtl"] .doc-content ol {
        margin: 0 24px 18px 0;
      }
      .doc-content li {
        margin-bottom: 6px;
      }
      .doc-content pre {
        background: var(--surface-sub);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px;
        overflow-x: auto;
        margin: 20px 0;
        font-family: var(--font-mono);
        font-size: 14px;
        direction: ltr;
        text-align: left;
      }
      .doc-content code:not(pre code) {
        background: var(--surface-sub);
        border: 1px solid var(--border);
        padding: 2px 6px;
        border-radius: 6px;
        font-family: var(--font-mono);
        font-size: 13.5px;
      }
      .doc-content blockquote {
        border-left: 3px solid var(--ink);
        padding-left: 16px;
        margin: 20px 0;
        color: var(--muted);
      }
      html[dir="rtl"] .doc-content blockquote {
        border-left: none;
        border-right: 3px solid var(--ink);
        padding-left: 0;
        padding-right: 16px;
      }
      .doc-content table {
        width: 100%;
        border-collapse: collapse;
        margin: 20px 0;
      }
      .doc-content th, .doc-content td {
        border: 1px solid var(--border);
        padding: 10px 14px;
        text-align: left;
      }
      html[dir="rtl"] .doc-content th, html[dir="rtl"] .doc-content td {
        text-align: right;
      }
      .doc-content th {
        background: var(--surface-sub);
        font-weight: 600;
      }

      /* Mobile Drawer */
      .menu-toggle {
        display: none;
        background: none;
        border: none;
        color: var(--ink);
        cursor: pointer;
        padding: 6px;
      }

      @media (max-width: 860px) {
        aside {
          position: fixed;
          left: -100%;
          top: var(--header-h);
          z-index: 90;
          transition: left 0.25s ease;
          width: 80%;
          max-width: 320px;
          box-shadow: 4px 0 20px rgba(0,0,0,0.1);
        }
        html[dir="rtl"] aside {
          left: auto;
          right: -100%;
          transition: right 0.25s ease;
          box-shadow: -4px 0 20px rgba(0,0,0,0.1);
        }
        aside.open {
          left: 0;
        }
        html[dir="rtl"] aside.open {
          right: 0;
        }
        .menu-toggle {
          display: block;
        }
        main {
          padding: 24px 18px 60px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div style="display: flex; align-items: center; gap: 12px;">
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <a href="/" class="brand-box">
          <svg class="brand-logo" viewBox="70 70 1941 662">

            <path d="M245.43 348.93L137.90 556.43A72.01 72.00 0 0 0 265.76 622.69L373.29 415.19Z" />
            <path d="M914.9 672.0 756.8 298.9H883.4L990.9 609.0H936.4L1043.1 298.9H1167.5L1010.1 672.0Z" />
            <path d="M1210.5 672.0V298.9H1327.2V672.0ZM1327.2 466.3 1277.3 429.4Q1291.9 362.6 1326.8 326.9Q1361.7 291.2 1422.4 291.2Q1450.0 291.2 1470.3 298.9Q1490.7 306.6 1506.0 324.2L1437.0 412.5Q1429.3 404.1 1417.8 399.8Q1406.2 395.6 1391.7 395.6Q1361.7 395.6 1344.4 413.3Q1327.2 430.9 1327.2 466.3Z" />
            <path d="M1729.9 680.4Q1671.1 680.4 1625.0 654.7Q1579.0 629.0 1552.1 584.3Q1525.2 539.5 1525.2 484.1Q1525.2 429.4 1552.1 385.6Q1579.0 341.9 1625.0 316.2Q1671.1 290.5 1730.2 290.5Q1787.3 290.5 1834.0 315.8Q1880.7 341.1 1907.6 385.3Q1934.4 429.4 1934.4 484.7Q1934.4 539.6 1907.6 583.9Q1880.7 628.2 1834.2 654.3Q1787.8 680.4 1729.9 680.4ZM1729.7 573.0Q1754.5 573.0 1773.9 561.8Q1793.2 550.7 1803.9 531.1Q1814.7 511.5 1814.7 485.1Q1814.7 459.2 1803.2 438.9Q1791.6 418.7 1773.0 407.9Q1754.5 397.2 1730.2 397.2Q1704.9 397.2 1686.1 408.3Q1667.3 419.4 1656.1 439.4Q1645.0 459.3 1645.0 484.8Q1645.0 510.8 1656.1 530.7Q1667.3 550.7 1686.1 561.8Q1704.9 573.0 1729.7 573.0Z" />
          </svg>
          <span style="font-size: 16px; font-weight: 500; opacity: 0.7;">Docs</span>
        </a>
      </div>

      <div class="header-actions">
        <select id="langSelect" class="lang-select" aria-label="Select Language">
          <option value="ar">العربية (Arabic)</option>
          <option value="en">English</option>
          <option value="zh">简体中文</option>
          <option value="zh-Hant">繁體中文</option>
        </select>
        <button id="themeToggle" class="theme-btn" aria-label="Toggle theme">◑</button>
        <a href="https://github.com/fifikoridek2-boop/Avro" target="_blank" rel="noopener" class="nav-link-btn">GitHub ↗</a>
      </div>
    </header>

    <div class="layout-container">
      <aside id="sidebar">
        <div class="search-box">
          <input type="text" id="searchInput" class="search-input" placeholder="Search documentation..." />
        </div>
        <nav id="docNav"></nav>
      </aside>

      <main>
        <article id="docBody" class="doc-content">
          <div style="padding: 40px 0; text-align: center; color: var(--muted);">Loading documentation...</div>
        </article>
      </main>
    </div>

    <script>
      const NAV_STRUCTURE = [
        {
          category: { en: "Getting Started", ar: "البداية والأساسيات", zh: "快速上手", "zh-Hant": "快速上手" },
          items: [
            { id: "index", title: { en: "Overview", ar: "نظرة عامة", zh: "概述", "zh-Hant": "概述" } },
            { id: "getting-started", title: { en: "Getting Started", ar: "البداية السريعة", zh: "入门指南", "zh-Hant": "入門指南" } },
            { id: "about", title: { en: "About Avro", ar: "حول Avro", zh: "关于 Avro", "zh-Hant": "關於 Avro" } },
            { id: "privacy", title: { en: "Privacy Policy", ar: "سياسة الخصوصية", zh: "隐私政策", "zh-Hant": "隱私政策" } },
            { id: "faq", title: { en: "FAQ", ar: "الأسئلة الشائعة", zh: "常见问题", "zh-Hant": "常見問題" } }
          ]
        },
        {
          category: { en: "Models & Providers", ar: "النماذج وموفرو الخدمة", zh: "模型与提供商", "zh-Hant": "模型與提供商" },
          items: [
            { id: "models", title: { en: "Manage Models", ar: "إدارة النماذج", zh: "模型管理", "zh-Hant": "模型管理" } },
            { id: "provider", title: { en: "API Providers", ar: "موفرو الخدمة ومفاتيح API", zh: "API 提供商", "zh-Hant": "API 提供商" } },
            { id: "local-model", title: { en: "Local Models (GGUF)", ar: "النماذج المحلية (GGUF)", zh: "本地模型", "zh-Hant": "本地模型" } },
            { id: "context", title: { en: "Context Accounting", ar: "إدارة السياق والرموز", zh: "上下文核算", "zh-Hant": "上下文核算" } },
            { id: "generation", title: { en: "Generation Settings", ar: "معلمات التوليد", zh: "生成参数", "zh-Hant": "生成參數" } },
            { id: "system-prompts", title: { en: "System Prompts", ar: "التوجيهات النظامية", zh: "系统提示词", "zh-Hant": "系統提示詞" } }
          ]
        },
        {
          category: { en: "Agentic Tools & Sandbox", ar: "أدوات الوكيل وساندبوكس", zh: "智能体工具与沙盒", "zh-Hant": "智能體工具與沙盒" },
          items: [
            { id: "tools", title: { en: "Tools Overview", ar: "نظرة عامة على الأدوات", zh: "工具概览", "zh-Hant": "工具概覽" } },
            { id: "sandbox", title: { en: "Linux Sandbox (PRoot)", ar: "ساندبوكس لينكس (PRoot)", zh: "Linux 沙盒", "zh-Hant": "Linux 沙盒" } },
            { id: "shell", title: { en: "Shell Execution", ar: "أوامر الشل والتحكم", zh: "Shell 设置", "zh-Hant": "Shell 設定" } },
            { id: "mcp", title: { en: "Model Context Protocol", ar: "بروتوكول MCP", zh: "MCP 协议", "zh-Hant": "MCP 協定" } },
            { id: "automation", title: { en: "Automation & Loops", ar: "الأتمتة وحلقات العمل", zh: "自动化与循环", "zh-Hant": "自動化與循環" } },
            { id: "skills", title: { en: "Custom Skills", ar: "المهارات المخصصة", zh: "技能管理", "zh-Hant": "技能管理" } }
          ]
        },
        {
          category: { en: "Search & Memory", ar: "البحث والذاكرة", zh: "搜索与记忆", "zh-Hant": "搜尋與記憶" },
          items: [
            { id: "search", title: { en: "Conversation Search", ar: "البحث في المحادثات", zh: "对话搜索", "zh-Hant": "對話搜尋" } },
            { id: "web-search", title: { en: "Web Search", ar: "البحث في الويب", zh: "网络搜索", "zh-Hant": "網路搜尋" } },
            { id: "embedding", title: { en: "Embedding & RAG", ar: "التضمين الشعاعي والـ RAG", zh: "嵌入与检索", "zh-Hant": "嵌入與檢索" } },
            { id: "memory", title: { en: "Active Memory", ar: "الذاكرة النشطة", zh: "持久记忆", "zh-Hant": "持久記憶" } }
          ]
        },
        {
          category: { en: "Media & Intelligence", ar: "الوسائط والذكاء", zh: "多媒体与智能", "zh-Hant": "多媒體與智慧" },
          items: [
            { id: "image-generation", title: { en: "Image Generation", ar: "توليد الصور", zh: "图像生成", "zh-Hant": "圖像生成" } },
            { id: "transcription", title: { en: "Audio Transcription", ar: "التفريغ الصوتي (Whisper)", zh: "语音转录", "zh-Hant": "語音轉錄" } },
            { id: "pdf-import", title: { en: "PDF Document Import", ar: "استيراد وقراءة PDF", zh: "PDF 导入", "zh-Hant": "PDF 匯入" } }
          ]
        },
        {
          category: { en: "System & Data", ar: "النظام والبيانات", zh: "系统与数据", "zh-Hant": "系統與資料" },
          items: [
            { id: "import-export", title: { en: "Import & Export (.avro)", ar: "النسخ الاحتياطي (.avro)", zh: "数据导入导出", "zh-Hant": "資料匯入匯出" } },
            { id: "conversations", title: { en: "Conversations Trees", ar: "إدارة المحادثات والتفرع", zh: "对话分支", "zh-Hant": "對話分支" } },
            { id: "appearance", title: { en: "Appearance & Themes", ar: "المظهر والسمات الأحادية", zh: "外观与主题", "zh-Hant": "外觀與主題" } },
            { id: "language", title: { en: "Languages", ar: "تعدد اللغات", zh: "语言设置", "zh-Hant": "語言設定" } },
            { id: "title-generation", title: { en: "Title Generation", ar: "توليد العناوين التلقائي", zh: "标题生成", "zh-Hant": "標題生成" } },
            { id: "proxy", title: { en: "Proxy & Network", ar: "البروكسي والشبكة", zh: "代理设置", "zh-Hant": "代理設定" } }
          ]
        }
      ];

      // State
      let currentLang = "ar";
      let currentDoc = "index";

      function parseRoute() {
        const path = window.location.pathname.replace(/^\/docs\/?/, "");
        const parts = path.split("/").filter(Boolean);
        
        const params = new URLSearchParams(window.location.search);
        const qLang = params.get("lang");
        const qDoc = params.get("doc");

        if (parts.length >= 2) {
          currentLang = parts[0];
          currentDoc = parts[1].replace(/\.md$/, "");
        } else if (parts.length === 1) {
          if (["ar", "en", "zh", "zh-Hant"].includes(parts[0])) {
            currentLang = parts[0];
            currentDoc = "index";
          } else {
            currentDoc = parts[0].replace(/\.md$/, "");
          }
        }

        if (qLang) currentLang = qLang;
        if (qDoc) currentDoc = qDoc.replace(/\.md$/, "");

        if (!["ar", "en", "zh", "zh-Hant"].includes(currentLang)) {
          currentLang = "ar";
        }
      }

      function updateDirection() {
        const isRtl = currentLang === "ar";
        document.documentElement.setAttribute("dir", isRtl ? "rtl" : "ltr");
        document.documentElement.setAttribute("lang", currentLang);
        document.getElementById("langSelect").value = currentLang;
      }

      function renderNav() {
        const nav = document.getElementById("docNav");
        nav.innerHTML = "";
        
        NAV_STRUCTURE.forEach(group => {
          const title = group.category[currentLang] || group.category.en;
          const h = document.createElement("div");
          h.className = "nav-group-title";
          h.textContent = title;
          nav.appendChild(h);

          group.items.forEach(item => {
            const a = document.createElement("a");
            a.className = "nav-item" + (item.id === currentDoc ? " active" : "");
            a.textContent = item.title[currentLang] || item.title.en;
            a.href = "/docs/" + currentLang + "/" + item.id;
            a.onclick = (e) => {
              e.preventDefault();
              loadDoc(item.id);
              if (window.innerWidth <= 860) {
                document.getElementById("sidebar").classList.remove("open");
              }
            };
            nav.appendChild(a);
          });
        });
      }

      async function loadDoc(docId) {
        currentDoc = docId;
        const stateUrl = "/docs/" + currentLang + "/" + docId;
        window.history.pushState({ lang: currentLang, doc: docId }, "", stateUrl);

        document.querySelectorAll(".nav-item").forEach(el => {
          el.classList.toggle("active", el.getAttribute("href").endsWith("/" + docId));
        });

        const docBody = document.getElementById("docBody");
        docBody.innerHTML = '<div style="padding: 40px 0; text-align: center; color: var(--muted);">' + 
          (currentLang === "ar" ? "جارٍ تحميل المستند..." : "Loading document...") + '</div>';

        const filePath = "/docs/content/" + currentLang + "/" + docId + ".md";

        try {
          const res = await fetch(filePath);
          if (!res.ok) throw new Error("File not found");
          const md = await res.text();
          docBody.innerHTML = marked.parse(md);
          document.querySelectorAll("pre code").forEach(el => {
            hljs.highlightElement(el);
          });
          window.scrollTo({ top: 0, behavior: "smooth" });
        } catch (err) {
          docBody.innerHTML = '<div style="padding: 40px 0; text-align: center; color: #e53935;">' +
            (currentLang === "ar" ? "تعذر تحميل هذا الدليل حالياً." : "Could not load this document.") +
            '<br><br><a href="/docs/' + currentLang + '/index" class="nav-link-btn" style="display:inline-block;">' +
            (currentLang === "ar" ? "العودة للرئيسية" : "Back to Overview") + '</a></div>';
        }
      }

      // Event Listeners
      document.getElementById("langSelect").addEventListener("change", (e) => {
        currentLang = e.target.value;
        updateDirection();
        renderNav();
        loadDoc(currentDoc);
      });

      const themeToggle = document.getElementById("themeToggle");
      themeToggle.addEventListener("click", () => {
        const isDark = document.documentElement.getAttribute("data-theme") === "dark";
        document.documentElement.setAttribute("data-theme", isDark ? "light" : "dark");
        localStorage.setItem("avro_theme", isDark ? "light" : "dark");
      });

      if (localStorage.getItem("avro_theme") === "dark" || window.matchMedia("(prefers-color-scheme: dark)").matches) {
        document.documentElement.setAttribute("data-theme", "dark");
      }

      document.getElementById("menuToggle").addEventListener("click", () => {
        document.getElementById("sidebar").classList.toggle("open");
      });

      document.getElementById("searchInput").addEventListener("input", (e) => {
        const q = e.target.value.toLowerCase().trim();
        document.querySelectorAll(".nav-item").forEach(item => {
          const match = item.textContent.toLowerCase().includes(q);
          item.style.display = match ? "block" : "none";
        });
      });

      window.addEventListener("popstate", () => {
        parseRoute();
        updateDirection();
        renderNav();
        loadDoc(currentDoc);
      });

      // Init
      parseRoute();
      updateDirection();
      renderNav();
      loadDoc(currentDoc);
    </script>
  </body>
</html>
