    <title>Avro Documentation · دليل توثيق Avro</title>

    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css" id="hljsTheme" />
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/highlight.min.js"></script>

    <style>
      :root {
        --ink: #0d0d0d;
        --surface: #ffffff;
        --surface-sub: #f6f6f6;
        --border: #e2e2e2;
        --muted: #666666;
        --accent: #000000;
        --accent-light: #eaeaea;
        --sidebar-w: 270px;
        --header-h: 68px;
        --radius: 10px;
        --font-main: "Outfit", system-ui, sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }

      [data-theme="dark"] {
        --ink: #f0f0f0;
        --surface: #0a0a0a;
        --surface-sub: #141414;
        --border: #222222;
        --muted: #888888;
        --accent: #ffffff;
        --accent-light: #1c1c1c;
      }

      html[dir="rtl"] {
        --font-main: "Noto Sans Arabic", "Outfit", system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      ::selection {
        background: #333333;
        color: #ffffff;
      }
      [data-theme="light"] ::selection {
        background: #171717;
        color: #ffffff;
      }

      /* Custom Monochrome Scrollbars */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(140, 140, 140, 0.24);
        border-radius: 999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(140, 140, 140, 0.45);
      }
      [data-theme="dark"] ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.16);
      }
      [data-theme="dark"] ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.32);
      }
      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(140, 140, 140, 0.24) transparent;
      }
      [data-theme="dark"] * {
        scrollbar-color: rgba(255, 255, 255, 0.16) transparent;
      }

      body {
        font-family: var(--font-main);
        background: var(--surface);
        color: var(--ink);
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      /* Header Bar */
      header {
        position: sticky;
        top: 0;
        z-index: 100;
        height: var(--header-h);
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
      }

      .header-start {
        display: inline-flex;
        align-items: center;
        gap: 12px;
      }

      .brand-box {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        color: var(--ink);
        flex-shrink: 0;
      }

      .brand-logo {
        height: 22px;
        width: auto;
        display: block;
        fill: currentColor;
      }

      .docs-tag {
        display: inline-flex;
        align-items: center;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        padding: 3px 8px;
        border-radius: 6px;
        background: var(--surface-sub);
        color: var(--muted);
        border: 1px solid var(--border);
        line-height: 1;
      }

      .header-actions {
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }

      /* Custom Modern Dropdown Pill */
      .select-wrapper {
        position: relative;
        display: inline-flex;
        align-items: center;
      }

      .lang-select {
        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: none;
        background: var(--surface-sub);
        border: 1px solid var(--border);
        color: var(--ink);
        padding: 7px 32px 7px 14px;
        border-radius: 999px;
        font-family: inherit;
        font-size: 13.5px;
        font-weight: 500;
        cursor: pointer;
        outline: none;
        transition: all 0.2s;
      }
      html[dir="rtl"] .lang-select {
        padding: 7px 14px 7px 32px;
      }
      .lang-select:hover, .lang-select:focus {
        border-color: var(--muted);
      }
      .lang-select option {
        background: var(--surface);
        color: var(--ink);
      }

      .select-chevron {
        position: absolute;
        right: 12px;
        pointer-events: none;
        width: 12px;
        height: 12px;
        color: var(--muted);
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      html[dir="rtl"] .select-chevron {
        right: auto;
        left: 12px;
      }

      .icon-btn {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: var(--surface-sub);
        border: 1px solid var(--border);
        color: var(--ink);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.2s;
        flex-shrink: 0;
      }
      .icon-btn:hover {
        background: var(--accent-light);
        border-color: var(--muted);
      }

      .github-btn {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        background: var(--surface-sub);
        border: 1px solid var(--border);
        color: var(--ink);
        padding: 7px 14px;
        border-radius: 999px;
        font-size: 13.5px;
        font-weight: 500;
        text-decoration: none;
        transition: all 0.2s;
        flex-shrink: 0;
      }
      .github-btn:hover {
        background: var(--accent-light);
        border-color: var(--muted);
      }

      .menu-toggle {
        display: none;
        background: none;
        border: none;
        color: var(--ink);
        cursor: pointer;
        padding: 6px;
        border-radius: 6px;
      }
      .menu-toggle:hover {
        background: var(--surface-sub);
      }

      /* Layout */
      .layout-container {
        display: flex;
        min-height: calc(100vh - var(--header-h));
      }

      /* Sidebar */
      aside {
        width: var(--sidebar-w);
        border-right: 1px solid var(--border);
        background: var(--surface);
        overflow-y: auto;
        position: sticky;
        top: var(--header-h);
        height: calc(100vh - var(--header-h));
        padding: 20px 14px 40px;
        flex-shrink: 0;
      }
      html[dir="rtl"] aside {
        border-right: none;
        border-left: 1px solid var(--border);
      }

      .search-box {
        margin-bottom: 18px;
      }
      .search-input {
        width: 100%;
        background: var(--surface-sub);
        border: 1px solid var(--border);
        padding: 8px 12px;
        border-radius: 8px;
        color: var(--ink);
        font-family: inherit;
        font-size: 13.5px;
        outline: none;
        transition: border-color 0.2s;
      }
      .search-input:focus {
        border-color: var(--muted);
      }

      .nav-group-title {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        font-weight: 700;
        margin: 20px 8px 8px;
      }
      .nav-item {
        display: block;
        padding: 7px 12px;
        border-radius: 6px;
        text-decoration: none;
        color: var(--muted);
        font-size: 13.5px;
        transition: all 0.15s ease;
        margin-bottom: 2px;
        border-inline-start: 3px solid transparent;
      }
      .nav-item:hover {
        color: var(--ink);
        background: var(--surface-sub);
      }
      .nav-item.active {
        color: var(--ink);
        background: var(--accent-light);
        font-weight: 600;
        border-inline-start-color: var(--ink);
      }

      /* Main Article Content */
      main {
        flex: 1;
        max-width: 860px;
        margin: 0 auto;
        padding: 44px 36px 90px;
      }

      .doc-content h1 {
        font-size: 36px;
        letter-spacing: -0.035em;
        margin-bottom: 20px;
        line-height: 1.25;
        font-weight: 700;
      }
      .doc-content h2 {
        font-size: 24px;
        letter-spacing: -0.025em;
        margin: 40px 0 16px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--border);
        font-weight: 600;
      }
      .doc-content h3 {
        font-size: 19px;
        letter-spacing: -0.015em;
        margin: 28px 0 12px;
        font-weight: 600;
      }
      .doc-content p {
        margin-bottom: 18px;
        font-size: 16px;
        color: var(--ink);
        line-height: 1.75;
      }

      /* Pure Monochrome Link Styling — NO BLUE! */
      .doc-content a {
        color: inherit;
        font-weight: 500;
        text-decoration: underline;
        text-decoration-color: var(--muted);
        text-underline-offset: 3.5px;
        transition: all 0.2s ease;
      }
      .doc-content a:hover {
        color: var(--ink);
        text-decoration-color: var(--ink);
        background: var(--surface-sub);
        border-radius: 4px;
      }

      .doc-content ul, .doc-content ol {
        margin: 0 0 20px 24px;
      }
      html[dir="rtl"] .doc-content ul, html[dir="rtl"] .doc-content ol {
        margin: 0 24px 20px 0;
      }
      .doc-content li {
        margin-bottom: 8px;
        line-height: 1.7;
      }

      /* Monochrome Code Blocks */
      .doc-content pre {
        background: var(--surface-sub) !important;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px 18px;
        overflow-x: auto;
        margin: 22px 0;
        font-family: var(--font-mono);
        font-size: 13.5px;
        line-height: 1.65;
        direction: ltr !important;
        text-align: left !important;
      }
      .doc-content code:not(pre code) {
        background: var(--surface-sub);
        border: 1px solid var(--border);
        color: var(--ink);
        padding: 2.5px 7px;
        border-radius: 6px;
        font-family: var(--font-mono);
        font-size: 13px;
      }

      .doc-content blockquote {
        border-left: 3px solid var(--border);
        padding-left: 16px;
        margin: 22px 0;
        color: var(--muted);
        font-style: normal;
      }
      html[dir="rtl"] .doc-content blockquote {
        border-left: none;
        border-right: 3px solid var(--border);
        padding-left: 0;
        padding-right: 16px;
      }

      .doc-content table {
        width: 100%;
        border-collapse: collapse;
        margin: 24px 0;
        font-size: 14.5px;
      }
      .doc-content th, .doc-content td {
        border: 1px solid var(--border);
        padding: 11px 15px;
        text-align: left;
      }
      html[dir="rtl"] .doc-content th, html[dir="rtl"] .doc-content td {
        text-align: right;
      }
      .doc-content th {
        background: var(--surface-sub);
        font-weight: 600;
      }

      /* Mobile Precision Overrides */
      @media (max-width: 768px) {
        header {
          padding: 0 14px;
          height: 60px;
        }
        .header-actions {
          gap: 7px;
        }
        .github-btn span {
          display: none;
        }
        .github-btn {
          padding: 8px;
          border-radius: 50%;
          width: 34px;
          height: 34px;
          justify-content: center;
        }
        .icon-btn {
          width: 34px;
          height: 34px;
        }
        .lang-select {
          font-size: 12px;
          padding: 6px 24px 6px 10px;
          max-width: 105px;
          text-overflow: ellipsis;
        }
        html[dir="rtl"] .lang-select {
          padding: 6px 10px 6px 24px;
        }
        .select-chevron {
          right: 8px;
        }
        html[dir="rtl"] .select-chevron {
          left: 8px;
        }
        .brand-logo {
          height: 19px;
        }
        .docs-tag {
          font-size: 10px;
          padding: 2px 6px;
        }

        aside {
          position: fixed;
          left: -100%;
          top: 60px;
          z-index: 95;
          transition: left 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
          width: 82%;
          max-width: 320px;
          box-shadow: 4px 0 24px rgba(0,0,0,0.25);
          height: calc(100vh - 60px);
        }
        html[dir="rtl"] aside {
          left: auto;
          right: -100%;
          transition: right 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
          box-shadow: -4px 0 24px rgba(0,0,0,0.25);
        }
        aside.open {
          left: 0;
        }
        html[dir="rtl"] aside.open {
          right: 0;
        }
        .menu-toggle {
          display: inline-flex;
          align-items: center;
          justify-content: center;
        }
        main {
          padding: 24px 18px 60px;
        }
      }
    </style>
  </head>
  <body>

            { id: "tools", title: { en: "Tools Overview", ar: "نظرة عامة على الأدوات", zh: "工具概览", "zh-Hant": "工具概覽" } },
            { id: "sandbox", title: { en: "Linux Sandbox (PRoot)", ar: "ساندبوكس لينكس (PRoot)", zh: "Linux 沙盒", "zh-Hant": "Linux 沙盒" } },
            { id: "shell", title: { en: "Shell Execution", ar: "أوامر الشل والتحكم", zh: "Shell 设置", "zh-Hant": "Shell 設定" } },
            { id: "mcp", title: { en: "Model Context Protocol", ar: "بروتوكول MCP", zh: "MCP 协议", "zh-Hant": "MCP 協定" } },
            { id: "automation", title: { en: "Automation & Loops", ar: "الأتمتة وحلقات العمل", zh: "自动化与循环", "zh-Hant": "自動化與循環" } },
            { id: "skills", title: { en: "Custom Skills", ar: "المهارات المخصصة", zh: "技能管理", "zh-Hant": "技能管理" } }
          ]
        },
        {
          category: { en: "Search & Memory", ar: "البحث والذاكرة", zh: "搜索与记忆", "zh-Hant": "搜尋與記憶" },
          items: [
            { id: "search", title: { en: "Conversation Search", ar: "البحث في المحادثات", zh: "对话搜索", "zh-Hant": "對話搜尋" } },
            { id: "web-search", title: { en: "Web Search", ar: "البحث في الويب", zh: "网络搜索", "zh-Hant": "網路搜尋" } },
            { id: "embedding", title: { en: "Embedding & RAG", ar: "التضمين الشعاعي والـ RAG", zh: "嵌入与检索", "zh-Hant": "嵌入與檢索" } },
            { id: "memory", title: { en: "Active Memory", ar: "الذاكرة النشطة", zh: "持久记忆", "zh-Hant": "持久記憶" } }
          ]
        },
        {
          category: { en: "Media & Intelligence", ar: "الوسائط والذكاء", zh: "多媒体与智能", "zh-Hant": "多媒體與智慧" },
          items: [
            { id: "image-generation", title: { en: "Image Generation", ar: "توليد الصور", zh: "图像生成", "zh-Hant": "圖像生成" } },
            { id: "transcription", title: { en: "Audio Transcription", ar: "التفريغ الصوتي (Whisper)", zh: "语音转录", "zh-Hant": "語音轉錄" } },
            { id: "pdf-import", title: { en: "PDF Document Import", ar: "استيراد وقراءة PDF", zh: "PDF 导入", "zh-Hant": "PDF 匯入" } }
          ]
        },
        {
          category: { en: "System & Data", ar: "النظام والبيانات", zh: "系统与数据", "zh-Hant": "系統與資料" },
          items: [
            { id: "import-export", title: { en: "Import & Export (.avro)", ar: "النسخ الاحتياطي (.avro)", zh: "数据导入导出", "zh-Hant": "資料匯入匯出" } },
            { id: "conversations", title: { en: "Conversations Trees", ar: "إدارة المحادثات والتفرع", zh: "对话分支", "zh-Hant": "對話分支" } },
            { id: "appearance", title: { en: "Appearance & Themes", ar: "المظهر والسمات الأحادية", zh: "外观与主题", "zh-Hant": "外觀與主題" } },
            { id: "language", title: { en: "Languages", ar: "تعدد اللغات", zh: "语言设置", "zh-Hant": "語言設定" } },
            { id: "title-generation", title: { en: "Title Generation", ar: "توليد العناوين التلقائي", zh: "标题生成", "zh-Hant": "標題生成" } },
            { id: "proxy", title: { en: "Proxy & Network", ar: "البروكسي والشبكة", zh: "代理设置", "zh-Hant": "代理設定" } }
          ]
        }
      ];

      let currentLang = "ar";
      let currentDoc = "index";

      function parseRoute() {
        const path = window.location.pathname.replace(/^\/docs\/?/, "");
        const parts = path.split("/").filter(Boolean);
        
        const params = new URLSearchParams(window.location.search);
        const qLang = params.get("lang");
        const qDoc = params.get("doc");

        if (parts.length >= 2) {
          currentLang = parts[0];
          currentDoc = parts[1].replace(/\.md$/, "");
        } else if (parts.length === 1) {
          if (["ar", "en", "zh", "zh-Hant"].includes(parts[0])) {
            currentLang = parts[0];
            currentDoc = "index";
          } else {
            currentDoc = parts[0].replace(/\.md$/, "");
          }
        }

        if (qLang) currentLang = qLang;
        if (qDoc) currentDoc = qDoc.replace(/\.md$/, "");

        if (!["ar", "en", "zh", "zh-Hant"].includes(currentLang)) {
          currentLang = "ar";
        }
      }

      function updateDirection() {
        const isRtl = currentLang === "ar";
        document.documentElement.setAttribute("dir", isRtl ? "rtl" : "ltr");
        document.documentElement.setAttribute("lang", currentLang);
        document.getElementById("langSelect").value = currentLang;
      }

      function renderNav() {
        const nav = document.getElementById("docNav");
        nav.innerHTML = "";
        
        NAV_STRUCTURE.forEach(group => {
          const title = group.category[currentLang] || group.category.en;
          const h = document.createElement("div");
          h.className = "nav-group-title";
          h.textContent = title;
          nav.appendChild(h);

          group.items.forEach(item => {
            const a = document.createElement("a");
            a.className = "nav-item" + (item.id === currentDoc ? " active" : "");
            a.textContent = item.title[currentLang] || item.title.en;
            a.href = "/docs/" + currentLang + "/" + item.id;
            a.onclick = (e) => {
              e.preventDefault();
              loadDoc(item.id);
              if (window.innerWidth <= 768) {
                document.getElementById("sidebar").classList.remove("open");
              }
            };
            nav.appendChild(a);
          });
        });
      }

      async function loadDoc(docId) {
        currentDoc = docId;
        const stateUrl = "/docs/" + currentLang + "/" + docId;
        window.history.pushState({ lang: currentLang, doc: docId }, "", stateUrl);

        document.querySelectorAll(".nav-item").forEach(el => {
          el.classList.toggle("active", el.getAttribute("href").endsWith("/" + docId));
        });

        const docBody = document.getElementById("docBody");
        docBody.innerHTML = '<div style="padding: 40px 0; text-align: center; color: var(--muted);">' + 
          (currentLang === "ar" ? "جارٍ تحميل المستند..." : "Loading document...") + '</div>';

        const filePath = "/docs/content/" + currentLang + "/" + docId + ".md";

        try {
          const res = await fetch(filePath);
          if (!res.ok) throw new Error("File not found");
          const md = await res.text();
          docBody.innerHTML = marked.parse(md);
          document.querySelectorAll("pre code").forEach(el => {
            hljs.highlightElement(el);
          });
          window.scrollTo({ top: 0, behavior: "smooth" });
        } catch (err) {
          docBody.innerHTML = '<div style="padding: 40px 0; text-align: center; color: var(--muted);">' +
            (currentLang === "ar" ? "تعذر تحميل هذا الدليل حالياً." : "Could not load this document.") +
            '<br><br><a href="/docs/' + currentLang + '/index" class="github-btn" style="display:inline-flex;">' +
            (currentLang === "ar" ? "العودة للرئيسية" : "Back to Overview") + '</a></div>';
        }
      }

      document.getElementById("langSelect").addEventListener("change", (e) => {
        currentLang = e.target.value;
        updateDirection();
        renderNav();
        loadDoc(currentDoc);
      });

      const themeToggle = document.getElementById("themeToggle");
      themeToggle.addEventListener("click", () => {
        const isDark = document.documentElement.getAttribute("data-theme") === "dark";
        const nextTheme = isDark ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", nextTheme);
        localStorage.setItem("avro_theme", nextTheme);
        
        const hljsLink = document.getElementById("hljsTheme");
        if (hljsLink) {
          hljsLink.href = nextTheme === "dark" 
            ? "https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css"
            : "https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css";
        }
      });

      const savedTheme = localStorage.getItem("avro_theme") || "dark";
      document.documentElement.setAttribute("data-theme", savedTheme);

      document.getElementById("menuToggle").addEventListener("click", () => {
        document.getElementById("sidebar").classList.toggle("open");
      });

      document.getElementById("searchInput").addEventListener("input", (e) => {
        const q = e.target.value.toLowerCase().trim();
        document.querySelectorAll(".nav-item").forEach(item => {
          const match = item.textContent.toLowerCase().includes(q);
          item.style.display = match ? "block" : "none";
        });
      });

      window.addEventListener("popstate", () => {
        parseRoute();
        updateDirection();
        renderNav();
        loadDoc(currentDoc);
      });

      parseRoute();
      updateDirection();
      renderNav();
      loadDoc(currentDoc);
    </script>
  </body>
</html>
